<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aethon Interactive Counter Debug Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="counter-card">
    <h2>Interactive Counter App</h2>
    <p>Click the buttons below to adjust the count score.</p>
    
    <div class="display-box" id="countDisplay">0</div>
    
    <div class="btn-group">
      <button id="decrementBtn">- Decrease</button>
      <button id="resetBtn">Reset</button>
      <button id="incrementBtn">+ Increase</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
