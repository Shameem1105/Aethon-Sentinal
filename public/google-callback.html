<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in with Google - AETHON</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Roboto', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 32px 28px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .google-logo {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 500;
      color: #f1f5f9;
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .account-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }
    .account-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: #0f172a;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .account-item:hover {
      background: #334155;
      border-color: #6366f1;
      transform: translateY(-1px);
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }
    .info {
      overflow: hidden;
    }
    .name {
      font-size: 15px;
      font-weight: 500;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .email {
      font-size: 13px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .custom-input-box {
      margin-top: 16px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .custom-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .custom-input:focus {
      border-color: #6366f1;
    }
    .btn-submit {
      padding: 10px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-submit:hover {
      background: #4f46e5;
    }
    .spinner-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
    }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #6366f1;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card" id="card">
    <svg class="google-logo" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
    </svg>
    <h1>Sign in with Google</h1>
    <p class="subtitle">to continue to <strong>AETHON Portal</strong></p>

    <div class="spinner-container" id="spinner">
      <div class="spinner"></div>
      <p style="font-size: 14px; color: #94a3b8;">Authenticating account...</p>
    </div>

    <div id="account-selection">
      <div class="account-list">
        <div class="account-item" onclick="selectAccount('mohammedshameem1105@gmail.com', 'Mohammed Shameem')">
          <div class="avatar">MS</div>
          <div class="info">
            <div class="name">Mohammed Shameem</div>
            <div class="email">mohammedshameem1105@gmail.com</div>
          </div>
        </div>

        <div class="account-item" onclick="selectAccount('smvcreators43@gmail.com', 'SMV Admin')">
          <div class="avatar" style="background: linear-gradient(135deg, #10b981, #3b82f6);">SA</div>
          <div class="info">
            <div class="name">SMV Admin</div>
            <div class="email">smvcreators43@gmail.com</div>
          </div>
        </div>

        <div class="account-item" onclick="toggleCustomInput()">
          <div class="avatar" style="background: #475569;">+</div>
          <div class="info">
            <div class="name">Use another Google account</div>
            <div class="email">Sign in with a different email address</div>
          </div>
        </div>
      </div>

      <div class="custom-input-box" id="custom-box">
        <input type="email" id="custom-email" class="custom-input" placeholder="Enter your Google email address">
        <input type="text" id="custom-name" class="custom-input" placeholder="Enter your full name">
        <button class="btn-submit" onclick="submitCustomAccount()">Continue</button>
      </div>
    </div>
  </div>

  <script>
    function selectAccount(email, name) {
      document.getElementById('account-selection').style.display = 'none';
      document.getElementById('spinner').style.display = 'flex';

      setTimeout(() => {
        if (window.opener) {
          window.opener.postMessage({ type: "GOOGLE_AUTH_SUCCESS", email, name }, "*");
        }
        window.close();
      }, 500);
    }

    function toggleCustomInput() {
      const box = document.getElementById('custom-box');
      box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
    }

    function submitCustomAccount() {
      const email = document.getElementById('custom-email').value.trim();
      const name = document.getElementById('custom-name').value.trim() || email.split('@')[0];
      if (!email || !email.includes('@')) {
        alert('Please enter a valid email address.');
        return;
      }
      selectAccount(email, name);
    }

    (async function() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      const accessToken = params.get("access_token");

      if (accessToken) {
        document.getElementById('account-selection').style.display = 'none';
        document.getElementById('spinner').style.display = 'flex';

        try {
          const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          const profile = await res.json();
          if (window.opener) {
            window.opener.postMessage({ type: "GOOGLE_AUTH_SUCCESS", email: profile.email, name: profile.name }, "*");
          }
        } catch (e) {
          if (window.opener) {
            window.opener.postMessage({ type: "GOOGLE_AUTH_ERROR", error: e.message }, "*");
          }
        }
        window.close();
      }
    })();
  </script>
</body>
</html>
